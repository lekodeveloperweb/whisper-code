[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-code"
version = "1.0.0"
description = "Voice dictation for macOS using local OpenAI-compatible API"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Le Kodeveloper Web"}
]
keywords = ["voice", "dictation", "macos", "whisper", "clipboard"]
dependencies = [
    "PySide6>=6.8.0",
    "pyaudio>=0.2.14",
    "requests>=2.31.0",
    "pyperclip>=1.11.0",
    "pynput>=1.8.2",
    "numpy>=1.26.0",
    "pyright>=1.1.410",
]

[project.scripts]
whisper = "src.whisper_code.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
whisper_code = ["gui/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "mypy>=1.15.0",
    "types-requests>=2.31.0",
    "pytest-cov>=5.0.0",
    "responses>=0.25.0",
    "pyright>=1.1.410",
    "pyinstaller>=6.0",
    "mkdocs-material>=9.0.0",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true

[[tool.mypy.overrides]]
module = ["pyaudio", "pynput", "pynput.keyboard", "pyperclip", "numpy"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C9", "W", "SIM", "PT", "RET", "PLE", "PLR", "PLW"]
ignore = ["PLR0913", "PLR0912"]

[tool.ruff.format]
quote-style = "double"
