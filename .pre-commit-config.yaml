repos:
  - repo: https://github.com/astral.sh/ruff
    rev: v0.11.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests>=2.31.0
          - PyQt5-stubs>=5.15.3
