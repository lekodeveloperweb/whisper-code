site_name: Whisper-Code
site_description: Voice dictation for macOS using local OpenAI-compatible API
site_url: https://github.com/lekodeveloperweb/whisper-code
repo_url: https://github.com/lekodeveloperweb/whisper-code
repo_name: lekodeveloperweb/whisper-code

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - toc.integrate

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Installation: installation/
  - Configuration: configuration/
  - Usage: usage/
  - Architecture: architecture/
  - Contributing: contributing/